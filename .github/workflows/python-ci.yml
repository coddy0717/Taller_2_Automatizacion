name: Python CI

# Ejecuta las pruebas automaticas y el analisis de cobertura
# cuando se sube codigo o se abre un Pull Request hacia developer o staging.
on:
  push:
    branches: [developer, staging, main]
  pull_request:
    branches: [developer, staging, main]

jobs:
  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias con cobertura
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage.xml
